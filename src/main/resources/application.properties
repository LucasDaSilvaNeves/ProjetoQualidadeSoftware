spring.application.name=alocacao-recursos

# MongoDB: configure MONGODB_URI (nunca commite senhas). Sem a variável, usa um MongoDB local.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/alocacao}
# Cria os índices únicos (usuário, recurso) na inicialização
spring.data.mongodb.auto-index-creation=true

# Tratamento seguro de erros: nada de stack trace ou mensagens internas na resposta
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Notificações: URL do webhook externo (vazio = apenas simulação gravada no banco)
app.notification.webhook-url=${NOTIFICATION_WEBHOOK_URL:}

# Administrador inicial: só é criado se ADMIN_PASSWORD for informado
app.bootstrap.admin-username=${ADMIN_USERNAME:admin}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}

management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html
