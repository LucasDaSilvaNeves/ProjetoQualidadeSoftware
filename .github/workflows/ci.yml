name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build, testes, cobertura e Sonar
    runs-on: ubuntu-latest   # já traz Docker, necessário para o Testcontainers
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # histórico completo: o Sonar precisa dele para atribuir novos problemas

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Testes unitários + integração + API + E2E + BDD, com cobertura JaCoCo
        run: ./mvnw -B verify

      - name: Análise estática no SonarCloud
        # PRs vindos de forks não têm acesso ao segredo; nesse caso o passo é ignorado.
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
            target/cucumber-report.html
